<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Cards rest flat; only the form card is lifted" name="Shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-ink);background:#fff;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}.chip{height:64px;border-radius:8px;border:1px solid var(--border-default)}
.n{margin-top:8px;font-size:12px;font-weight:600}.v{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="row" style="padding:8px 0 14px"><div class="sw"><div style="height:72px;border-radius:12px;border:1px solid #c9d3dc;background:#fff;box-shadow:var(--shadow-lifted)"></div><div class="n">lifted</div><div class="v">form card</div></div><div class="sw"><div style="height:72px;border-radius:12px;border:1px solid #c9d3dc;background:#fff;box-shadow:var(--shadow-card-hover)"></div><div class="n">card-hover</div><div class="v">build card hover</div></div><div class="sw"><div style="height:72px;border-radius:12px;border:1px solid #c9d3dc;background:#fff;box-shadow:var(--shadow-cta)"></div><div class="n">cta</div><div class="v">sticky Continue</div></div><div class="sw"><div style="height:72px;border-radius:12px;border:1px solid #c9d3dc;background:#fff;box-shadow:none"></div><div class="n">rest</div><div class="v">every other card</div></div></div></body></html>
