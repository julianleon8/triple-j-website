<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-ink);background:#fff;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}.chip{height:64px;border-radius:8px;border:1px solid var(--border-default)}
.n{margin-top:8px;font-size:12px;font-weight:600}.v{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="background:#00182a;border-radius:12px;padding:16px;display:flex;gap:10px"><div style="flex:1;height:70px;border-radius:8px;border:1px solid rgba(201,211,220,.12);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#9fb0c0">.12</div><div style="flex:1;height:70px;border-radius:8px;border:1px solid rgba(201,211,220,.16);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#9fb0c0">.16</div><div style="flex:1;height:70px;border-radius:8px;border:1px solid rgba(201,211,220,.18);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#9fb0c0">.18</div><div style="flex:1;height:70px;border-radius:8px;border:1px solid rgba(201,211,220,.22);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#9fb0c0">.22</div><div style="flex:1;height:70px;border-radius:8px;border:1px solid rgba(255,255,255,.3);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#9fb0c0">white .3</div><div style="flex:1;height:70px;border-radius:8px;border:1px solid rgba(255,255,255,.4);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#9fb0c0">white .4</div></div></body></html>
