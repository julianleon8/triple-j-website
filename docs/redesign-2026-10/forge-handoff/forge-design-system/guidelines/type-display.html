<!-- @dsCard group="Type" viewport="700x200" subtitle="900 for h1/h2 + wordmark, 700 for titles. Sentence case, .01em" name="Display — Cinzel" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-ink);background:#fff;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px}.chip{height:64px;border-radius:8px;border:1px solid var(--border-default)}
.n{margin-top:8px;font-size:12px;font-weight:600}.v{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="font-family:var(--font-display);font-weight:900;font-size:56px;line-height:1.05;letter-spacing:.01em">Built right. <span style="color:#546678">Built fast.</span></div><div style="margin-top:14px;display:flex;gap:28px;align-items:baseline"><span style="font-family:var(--font-display);font-weight:700;font-size:28px">Cinzel Bold 700</span><span style="font-family:var(--font-display);font-weight:900;font-size:28px">Cinzel Black 900</span><span style="font-size:12px;color:#546678">Lowercase renders as small caps — never uppercase it.</span></div></body></html>
