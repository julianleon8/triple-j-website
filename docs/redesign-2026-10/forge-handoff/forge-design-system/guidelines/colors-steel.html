<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-ink);background:#fff;-webkit-font-smoothing:antialiased}

</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#788a9c;"></div><div class="n">steel</div><div class="v">#788a9c</div></div><div class="sw"><div class="chip" style="background:#9fb0c0;"></div><div class="n">steel-light</div><div class="v">#9fb0c0</div></div><div class="sw"><div class="chip" style="background:#c9d3dc;"></div><div class="n">silver</div><div class="v">#c9d3dc</div></div><div class="sw"><div class="chip" style="background:#e9eef2;"></div><div class="n">highlight</div><div class="v">#e9eef2</div></div></div></body></html>
